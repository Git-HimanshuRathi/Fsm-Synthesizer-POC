<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSM Synthesizer PoC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header span {
            font-size: 12px;
            background: #27ae60;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            padding: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Canvas area */
        .canvas-container {
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow: hidden;
        }

        .canvas-container canvas {
            display: block;
            width: 100%;
            cursor: crosshair;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s;
        }

        .toolbar button:hover {
            background: #f5f5f5;
            border-color: #bbb;
        }

        .toolbar button.primary {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .toolbar button.primary:hover {
            background: #219a52;
        }

        /* Selection panel */
        .selection-panel {
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 12px;
            min-height: 60px;
        }

        .selection-panel h4 {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .selection-panel p {
            font-size: 13px;
            color: #666;
            margin: 2px 0;
        }

        /* Right panel - results */
        .right-panel {
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        #results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-section {
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 14px;
        }

        .result-section h3 {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }

        .result-section p {
            font-size: 13px;
            margin: 4px 0;
            line-height: 1.5;
        }

        .result-section pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            overflow-x: auto;
            max-height: 200px;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 8px 0;
        }

        th, td {
            padding: 5px 10px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        th {
            background: #f5f7fa;
            font-weight: 600;
            font-size: 12px;
        }

        tr.dont-care {
            background: #fff3cd;
            color: #856404;
        }

        /* Equations */
        .equations {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .equation {
            background: #f0fdf4;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #27ae60;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        /* Misc */
        .error-list li { color: #e74c3c; margin: 4px 0; list-style: none; }
        .warning-list li { color: #f39c12; margin: 4px 0; list-style: none; }
        .placeholder { color: #999; font-size: 13px; text-align: center; padding: 20px; }
        .note { font-size: 12px; color: #888; margin-top: 8px; font-style: italic; }

        .shortcuts {
            font-size: 12px;
            color: #666;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>FSM → Circuit Synthesizer</h1>
        <span>PoC</span>
    </header>

    <div class="layout">
        <div class="left-panel">
            <div class="toolbar">
                <button id="load-example-btn">Load Example</button>
                <button id="synthesize-btn" class="primary">Synthesize</button>
                <button id="clear-btn">Clear</button>
            </div>

            <div class="canvas-container">
                <canvas id="fsm-canvas"></canvas>
            </div>

            <div class="selection-panel" id="selection-panel">
                <p class="placeholder">Click a state or transition to see its properties.</p>
            </div>

            <div class="shortcuts">
                <strong>Controls:</strong>
                Double-click → Add state &nbsp;|&nbsp;
                Shift + Drag → Add transition &nbsp;|&nbsp;
                Right-click state → Set initial / Delete / Set output &nbsp;|&nbsp;
                Drag state → Move
            </div>
        </div>

        <div class="right-panel">
            <div id="results">
                <p class="placeholder">Draw an FSM and click Synthesize.</p>
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
